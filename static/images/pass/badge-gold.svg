<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 512 512" width="512" height="512">
  <defs>
    <linearGradient id="gld" x1="0" y1="0" x2="1" y2="1">
      <stop offset="0" stop-color="#ffd34e"/>
      <stop offset="1" stop-color="#f3a712"/>
    </linearGradient>
  </defs>
  <!-- ribbons -->
  <path d="M196 300l-40 150 60-34 36 44 18-110z" fill="#ef4d4d"/>
  <path d="M316 300l40 150-60-34-36 44-18-110z" fill="#ef4d4d"/>
  <!-- scalloped medal -->
  <g transform="translate(256 200)">
    <g fill="url(#gld)">
      <circle cx="0" cy="0" r="140"/>
      <g id="petal">
        <circle cx="0" cy="-140" r="26"/>
      </g>
      <use href="#petal" transform="rotate(30)"/>
      <use href="#petal" transform="rotate(60)"/>
      <use href="#petal" transform="rotate(90)"/>
      <use href="#petal" transform="rotate(120)"/>
      <use href="#petal" transform="rotate(150)"/>
      <use href="#petal" transform="rotate(180)"/>
      <use href="#petal" transform="rotate(210)"/>
      <use href="#petal" transform="rotate(240)"/>
      <use href="#petal" transform="rotate(270)"/>
      <use href="#petal" transform="rotate(300)"/>
      <use href="#petal" transform="rotate(330)"/>
    </g>
    <circle cx="0" cy="0" r="108" fill="#f6b820"/>
    <circle cx="0" cy="0" r="86" fill="none" stroke="#ffe78a" stroke-width="10"/>
    <path d="M0 -64l22 45 50 7-36 35 8 50-44-23-44 23 8-50-36-35 50-7z" fill="#fff0b0"/>
  </g>
  <!-- sparkle -->
  <path d="M150 120l8 22 22 8-22 8-8 22-8-22-22-8 22-8z" fill="#ffffff"/>
</svg>
