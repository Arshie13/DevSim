<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 120 120" width="120" height="120">
  <defs>
    <radialGradient id="bg2" cx="50%" cy="50%" r="50%">
      <stop offset="0%" stop-color="#1e1040"/>
      <stop offset="100%" stop-color="#0a0e1a"/>
    </radialGradient>
    <radialGradient id="face2" cx="50%" cy="40%" r="55%">
      <stop offset="0%" stop-color="#1e1040"/>
      <stop offset="100%" stop-color="#0d0a20"/>
    </radialGradient>
    <filter id="glow2">
      <feGaussianBlur stdDeviation="2.5" result="blur"/>
      <feMerge><feMergeNode in="blur"/><feMergeNode in="SourceGraphic"/></feMerge>
    </filter>
    <filter id="softglow2">
      <feGaussianBlur stdDeviation="1.5" result="blur"/>
      <feMerge><feMergeNode in="blur"/><feMergeNode in="SourceGraphic"/></feMerge>
    </filter>
    <clipPath id="hexclip2">
      <polygon points="60,4 112,32 112,88 60,116 8,88 8,32"/>
    </clipPath>
    <linearGradient id="ring2" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#a855f7"/>
      <stop offset="50%" stop-color="#d8b4fe"/>
      <stop offset="100%" stop-color="#a855f7" stop-opacity="0.2"/>
    </linearGradient>
  </defs>

  <!-- Outer ring glow -->
  <polygon points="60,2 114,31 114,89 60,118 6,89 6,31" fill="none" stroke="#a855f7" stroke-width="1.5" stroke-opacity="0.4" filter="url(#glow2)"/>
  <polygon points="60,2 114,31 114,89 60,118 6,89 6,31" fill="none" stroke="url(#ring2)" stroke-width="2" stroke-dasharray="80 180" stroke-dashoffset="30"/>

  <!-- Background hex -->
  <polygon points="60,6 110,33 110,87 60,114 10,87 10,33" fill="url(#bg2)" clip-path="url(#hexclip2)"/>

  <!-- Grid lines -->
  <g clip-path="url(#hexclip2)" opacity="0.07">
    <line x1="0" y1="20" x2="120" y2="20" stroke="#a855f7" stroke-width="0.5"/>
    <line x1="0" y1="40" x2="120" y2="40" stroke="#a855f7" stroke-width="0.5"/>
    <line x1="0" y1="60" x2="120" y2="60" stroke="#a855f7" stroke-width="0.5"/>
    <line x1="0" y1="80" x2="120" y2="80" stroke="#a855f7" stroke-width="0.5"/>
    <line x1="0" y1="100" x2="120" y2="100" stroke="#a855f7" stroke-width="0.5"/>
    <line x1="20" y1="0" x2="20" y2="120" stroke="#a855f7" stroke-width="0.5"/>
    <line x1="40" y1="0" x2="40" y2="120" stroke="#a855f7" stroke-width="0.5"/>
    <line x1="60" y1="0" x2="60" y2="120" stroke="#a855f7" stroke-width="0.5"/>
    <line x1="80" y1="0" x2="80" y2="120" stroke="#a855f7" stroke-width="0.5"/>
    <line x1="100" y1="0" x2="100" y2="120" stroke="#a855f7" stroke-width="0.5"/>
  </g>

  <!-- Body/shoulders -->
  <polygon points="32,114 88,114 96,108 80,96 40,96 24,108" fill="#0d0a20" clip-path="url(#hexclip2)"/>
  <!-- Collar -->
  <polygon points="52,96 68,96 72,102 60,105 48,102" fill="#a855f7" fill-opacity="0.25" clip-path="url(#hexclip2)"/>
  <line x1="60" y1="96" x2="60" y2="105" stroke="#a855f7" stroke-width="0.8" opacity="0.6"/>

  <!-- Head -->
  <ellipse cx="60" cy="62" rx="22" ry="24" fill="url(#face2)"/>
  <ellipse cx="60" cy="62" rx="22" ry="24" fill="none" stroke="#a855f7" stroke-width="0.8" stroke-opacity="0.5"/>

  <!-- Pointy witch-style ears (cute!) -->
  <polygon points="38,52 34,40 42,50" fill="#0d0a20" stroke="#a855f7" stroke-width="0.8" stroke-opacity="0.6"/>
  <polygon points="82,52 86,40 78,50" fill="#0d0a20" stroke="#a855f7" stroke-width="0.8" stroke-opacity="0.6"/>
  <polygon points="38,51 35,42 41,50" fill="#a855f7" fill-opacity="0.25"/>
  <polygon points="82,51 85,42 79,50" fill="#a855f7" fill-opacity="0.25"/>

  <!-- Hair with bangs -->
  <ellipse cx="60" cy="41" rx="22" ry="8" fill="#a855f7" fill-opacity="0.9"/>
  <!-- Side bangs -->
  <ellipse cx="43" cy="50" rx="7" ry="5" fill="#a855f7" fill-opacity="0.7"/>
  <ellipse cx="77" cy="50" rx="7" ry="5" fill="#a855f7" fill-opacity="0.7"/>

  <!-- Visor band -->
  <rect x="40" y="56" width="40" height="10" rx="3" fill="#a855f7" fill-opacity="0.18" stroke="#a855f7" stroke-width="0.8"/>
  <!-- Eyes -->
  <ellipse cx="50" cy="61" rx="5" ry="3.5" fill="#a855f7" fill-opacity="0.95" filter="url(#softglow2)"/>
  <ellipse cx="70" cy="61" rx="5" ry="3.5" fill="#a855f7" fill-opacity="0.95" filter="url(#softglow2)"/>
  <!-- Eye pupils -->
  <ellipse cx="50" cy="61" rx="2.5" ry="2.5" fill="#d8b4fe"/>
  <ellipse cx="70" cy="61" rx="2.5" ry="2.5" fill="#d8b4fe"/>
  <!-- Eye shine -->
  <ellipse cx="48.5" cy="60" rx="1.5" ry="1" fill="#fff" fill-opacity="0.9"/>
  <ellipse cx="68.5" cy="60" rx="1.5" ry="1" fill="#fff" fill-opacity="0.9"/>

  <!-- Small nose -->
  <ellipse cx="60" cy="68" rx="2" ry="1.5" fill="#a855f7" fill-opacity="0.4"/>

  <!-- Cute smile -->
  <path d="M 52 73 Q 60 79 68 73" fill="none" stroke="#a855f7" stroke-width="1.5" stroke-linecap="round"/>
  <!-- Blush -->
  <ellipse cx="44" cy="70" rx="5" ry="3" fill="#a855f7" fill-opacity="0.18"/>
  <ellipse cx="76" cy="70" rx="5" ry="3" fill="#a855f7" fill-opacity="0.18"/>

  <!-- Star sparkles -->
  <g filter="url(#softglow2)" opacity="0.8">
    <polygon points="22,45 23.5,41 25,45 29,45 25.8,47.5 27,51.5 23.5,49 20,51.5 21.2,47.5 18,45" fill="#a855f7" transform="scale(0.6) translate(17,28)"/>
    <polygon points="22,45 23.5,41 25,45 29,45 25.8,47.5 27,51.5 23.5,49 20,51.5 21.2,47.5 18,45" fill="#d8b4fe" transform="scale(0.4) translate(210,65)"/>
  </g>

  <!-- Corner cuts -->
  <polygon points="10,34 20,28 20,40" fill="#a855f7" fill-opacity="0.3"/>
  <polygon points="110,34 100,28 100,40" fill="#a855f7" fill-opacity="0.3"/>

  <!-- Status dot - purple/rare -->
  <circle cx="94" cy="88" r="4" fill="#a855f7" filter="url(#softglow2)"/>
  <circle cx="94" cy="88" r="2" fill="#d8b4fe"/>
</svg>