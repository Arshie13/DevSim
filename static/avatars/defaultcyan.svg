<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 120 120" width="120" height="120">
  <defs>
    <radialGradient id="bg1" cx="50%" cy="50%" r="50%">
      <stop offset="0%" stop-color="#1e3a5f"/>
      <stop offset="100%" stop-color="#0a0e1a"/>
    </radialGradient>
    <radialGradient id="face1" cx="50%" cy="40%" r="55%">
      <stop offset="0%" stop-color="#1e3a5f"/>
      <stop offset="100%" stop-color="#0d1f38"/>
    </radialGradient>
    <filter id="glow1">
      <feGaussianBlur stdDeviation="2.5" result="blur"/>
      <feMerge><feMergeNode in="blur"/><feMergeNode in="SourceGraphic"/></feMerge>
    </filter>
    <filter id="softglow">
      <feGaussianBlur stdDeviation="1.5" result="blur"/>
      <feMerge><feMergeNode in="blur"/><feMergeNode in="SourceGraphic"/></feMerge>
    </filter>
    <clipPath id="hexclip1">
      <polygon points="60,4 112,32 112,88 60,116 8,88 8,32"/>
    </clipPath>
    <linearGradient id="ring1" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#07a5c9"/>
      <stop offset="50%" stop-color="#00f5ff"/>
      <stop offset="100%" stop-color="#07a5c9" stop-opacity="0.2"/>
    </linearGradient>
  </defs>

  <!-- Outer ring glow -->
  <polygon points="60,2 114,31 114,89 60,118 6,89 6,31" fill="none" stroke="#07a5c9" stroke-width="1.5" stroke-opacity="0.4" filter="url(#glow1)"/>
  <!-- Spinning ring segment -->
  <polygon points="60,2 114,31 114,89 60,118 6,89 6,31" fill="none" stroke="url(#ring1)" stroke-width="2" stroke-dasharray="60 200"/>

  <!-- Background hex -->
  <polygon points="60,6 110,33 110,87 60,114 10,87 10,33" fill="url(#bg1)" clip-path="url(#hexclip1)"/>

  <!-- Subtle grid lines -->
  <g clip-path="url(#hexclip1)" opacity="0.07">
    <line x1="0" y1="20" x2="120" y2="20" stroke="#07a5c9" stroke-width="0.5"/>
    <line x1="0" y1="40" x2="120" y2="40" stroke="#07a5c9" stroke-width="0.5"/>
    <line x1="0" y1="60" x2="120" y2="60" stroke="#07a5c9" stroke-width="0.5"/>
    <line x1="0" y1="80" x2="120" y2="80" stroke="#07a5c9" stroke-width="0.5"/>
    <line x1="0" y1="100" x2="120" y2="100" stroke="#07a5c9" stroke-width="0.5"/>
    <line x1="20" y1="0" x2="20" y2="120" stroke="#07a5c9" stroke-width="0.5"/>
    <line x1="40" y1="0" x2="40" y2="120" stroke="#07a5c9" stroke-width="0.5"/>
    <line x1="60" y1="0" x2="60" y2="120" stroke="#07a5c9" stroke-width="0.5"/>
    <line x1="80" y1="0" x2="80" y2="120" stroke="#07a5c9" stroke-width="0.5"/>
    <line x1="100" y1="0" x2="100" y2="120" stroke="#07a5c9" stroke-width="0.5"/>
  </g>

  <!-- Body/shoulders -->
  <ellipse cx="60" cy="98" rx="28" ry="18" fill="#0d1f38" clip-path="url(#hexclip1)"/>
  <polygon points="32,114 88,114 96,108 80,96 40,96 24,108" fill="#0d1f38" clip-path="url(#hexclip1)"/>
  <!-- Collar detail -->
  <polygon points="52,96 68,96 72,102 60,105 48,102" fill="#07a5c9" fill-opacity="0.25" clip-path="url(#hexclip1)"/>
  <line x1="60" y1="96" x2="60" y2="105" stroke="#07a5c9" stroke-width="0.8" opacity="0.6"/>

  <!-- Head -->
  <ellipse cx="60" cy="62" rx="22" ry="24" fill="url(#face1)"/>
  <ellipse cx="60" cy="62" rx="22" ry="24" fill="none" stroke="#07a5c9" stroke-width="0.8" stroke-opacity="0.5"/>

  <!-- Cute ears -->
  <ellipse cx="38" cy="60" rx="4" ry="5" fill="#0d1f38" stroke="#07a5c9" stroke-width="0.8" stroke-opacity="0.5"/>
  <ellipse cx="82" cy="60" rx="4" ry="5" fill="#0d1f38" stroke="#07a5c9" stroke-width="0.8" stroke-opacity="0.5"/>
  <!-- Inner ear -->
  <ellipse cx="38" cy="60" rx="2" ry="3" fill="#07a5c9" fill-opacity="0.3"/>
  <ellipse cx="82" cy="60" rx="2" ry="3" fill="#07a5c9" fill-opacity="0.3"/>

  <!-- Hair / visor top -->
  <ellipse cx="60" cy="42" rx="20" ry="7" fill="#07a5c9" fill-opacity="0.85"/>
  <ellipse cx="60" cy="42" rx="20" ry="7" fill="none" stroke="#00f5ff" stroke-width="0.5"/>

  <!-- Visor / eyes band -->
  <rect x="40" y="56" width="40" height="10" rx="3" fill="#07a5c9" fill-opacity="0.2" stroke="#07a5c9" stroke-width="0.8"/>
  <!-- Eye glows -->
  <ellipse cx="50" cy="61" rx="5" ry="3.5" fill="#07a5c9" fill-opacity="0.9" filter="url(#softglow)"/>
  <ellipse cx="70" cy="61" rx="5" ry="3.5" fill="#07a5c9" fill-opacity="0.9" filter="url(#softglow)"/>
  <!-- Eye shine -->
  <ellipse cx="48" cy="60" rx="1.5" ry="1" fill="#fff" fill-opacity="0.8"/>
  <ellipse cx="68" cy="60" rx="1.5" ry="1" fill="#fff" fill-opacity="0.8"/>

  <!-- Cute nose -->
  <ellipse cx="60" cy="68" rx="2" ry="1.5" fill="#07a5c9" fill-opacity="0.5"/>

  <!-- Cute smile -->
  <path d="M 52 73 Q 60 79 68 73" fill="none" stroke="#07a5c9" stroke-width="1.5" stroke-linecap="round"/>
  <!-- Cheek blushes -->
  <ellipse cx="44" cy="70" rx="5" ry="3" fill="#07a5c9" fill-opacity="0.15"/>
  <ellipse cx="76" cy="70" rx="5" ry="3" fill="#07a5c9" fill-opacity="0.15"/>

  <!-- Corner cut decoration -->
  <polygon points="10,34 20,28 20,40" fill="#07a5c9" fill-opacity="0.3"/>
  <polygon points="110,34 100,28 100,40" fill="#07a5c9" fill-opacity="0.3"/>

  <!-- Status dot -->
  <circle cx="94" cy="88" r="4" fill="#00e5a0" filter="url(#softglow)"/>
  <circle cx="94" cy="88" r="2" fill="#00e5a0"/>
</svg>