<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 120 120" width="120" height="120">
  <defs>
    <radialGradient id="bg5" cx="50%" cy="50%" r="50%">
      <stop offset="0%" stop-color="#200010"/>
      <stop offset="100%" stop-color="#0a0e1a"/>
    </radialGradient>
    <radialGradient id="face5" cx="50%" cy="40%" r="55%">
      <stop offset="0%" stop-color="#200010"/>
      <stop offset="100%" stop-color="#100008"/>
    </radialGradient>
    <filter id="glow5">
      <feGaussianBlur stdDeviation="2.5" result="blur"/>
      <feMerge><feMergeNode in="blur"/><feMergeNode in="SourceGraphic"/></feMerge>
    </filter>
    <filter id="softglow5">
      <feGaussianBlur stdDeviation="1.5" result="blur"/>
      <feMerge><feMergeNode in="blur"/><feMergeNode in="SourceGraphic"/></feMerge>
    </filter>
    <clipPath id="hexclip5">
      <polygon points="60,4 112,32 112,88 60,116 8,88 8,32"/>
    </clipPath>
    <linearGradient id="ring5" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#ff3860"/>
      <stop offset="50%" stop-color="#ff80a0"/>
      <stop offset="100%" stop-color="#ff3860" stop-opacity="0.2"/>
    </linearGradient>
  </defs>

  <!-- Outer ring glow -->
  <polygon points="60,2 114,31 114,89 60,118 6,89 6,31" fill="none" stroke="#ff3860" stroke-width="1.5" stroke-opacity="0.4" filter="url(#glow5)"/>
  <polygon points="60,2 114,31 114,89 60,118 6,89 6,31" fill="none" stroke="url(#ring5)" stroke-width="2" stroke-dasharray="70 190" stroke-dashoffset="120"/>

  <!-- Background hex -->
  <polygon points="60,6 110,33 110,87 60,114 10,87 10,33" fill="url(#bg5)" clip-path="url(#hexclip5)"/>

  <!-- Grid lines -->
  <g clip-path="url(#hexclip5)" opacity="0.06">
    <line x1="0" y1="20" x2="120" y2="20" stroke="#ff3860" stroke-width="0.5"/>
    <line x1="0" y1="40" x2="120" y2="40" stroke="#ff3860" stroke-width="0.5"/>
    <line x1="0" y1="60" x2="120" y2="60" stroke="#ff3860" stroke-width="0.5"/>
    <line x1="0" y1="80" x2="120" y2="80" stroke="#ff3860" stroke-width="0.5"/>
    <line x1="0" y1="100" x2="120" y2="100" stroke="#ff3860" stroke-width="0.5"/>
    <line x1="20" y1="0" x2="20" y2="120" stroke="#ff3860" stroke-width="0.5"/>
    <line x1="40" y1="0" x2="40" y2="120" stroke="#ff3860" stroke-width="0.5"/>
    <line x1="60" y1="0" x2="60" y2="120" stroke="#ff3860" stroke-width="0.5"/>
    <line x1="80" y1="0" x2="80" y2="120" stroke="#ff3860" stroke-width="0.5"/>
    <line x1="100" y1="0" x2="100" y2="120" stroke="#ff3860" stroke-width="0.5"/>
  </g>

  <!-- Body - armored look -->
  <polygon points="32,114 88,114 96,108 80,96 40,96 24,108" fill="#100008" clip-path="url(#hexclip5)"/>
  <!-- Chest armor plate -->
  <polygon points="48,96 72,96 76,103 60,107 44,103" fill="#ff3860" fill-opacity="0.2" clip-path="url(#hexclip5)"/>
  <!-- Armor lines -->
  <line x1="60" y1="96" x2="60" y2="107" stroke="#ff3860" stroke-width="1" opacity="0.5"/>
  <line x1="48" y1="100" x2="72" y2="100" stroke="#ff3860" stroke-width="0.5" opacity="0.3"/>

  <!-- Head -->
  <ellipse cx="60" cy="62" rx="22" ry="24" fill="url(#face5)"/>
  <ellipse cx="60" cy="62" rx="22" ry="24" fill="none" stroke="#ff3860" stroke-width="0.8" stroke-opacity="0.5"/>

  <!-- Dragon-style horns -->
  <path d="M 41 48 L 36 28 L 45 44" fill="#200010" stroke="#ff3860" stroke-width="1" stroke-opacity="0.7" stroke-linejoin="round"/>
  <path d="M 79 48 L 84 28 L 75 44" fill="#200010" stroke="#ff3860" stroke-width="1" stroke-opacity="0.7" stroke-linejoin="round"/>
  <!-- Horn glow -->
  <path d="M 41 48 L 36 28 L 45 44" fill="#ff3860" fill-opacity="0.2"/>
  <path d="M 79 48 L 84 28 L 75 44" fill="#ff3860" fill-opacity="0.2"/>

  <!-- Wild hair -->
  <ellipse cx="60" cy="41" rx="21" ry="7" fill="#ff3860" fill-opacity="0.85"/>
  <!-- Side spikes -->
  <ellipse cx="44" cy="49" rx="7" ry="6" fill="#ff3860" fill-opacity="0.75"/>
  <ellipse cx="76" cy="49" rx="7" ry="6" fill="#ff3860" fill-opacity="0.75"/>
  <!-- Top spikes -->
  <polygon points="52,38 50,26 58,37" fill="#ff3860" fill-opacity="0.8"/>
  <polygon points="60,36 60,22 65,36" fill="#ff3860" fill-opacity="0.9"/>
  <polygon points="68,38 70,26 62,37" fill="#ff3860" fill-opacity="0.8"/>

  <!-- Visor band -->
  <rect x="40" y="56" width="40" height="10" rx="2" fill="#ff3860" fill-opacity="0.15" stroke="#ff3860" stroke-width="0.8"/>
  <!-- Narrow fierce eyes -->
  <ellipse cx="50" cy="61" rx="5" ry="2.5" fill="#ff3860" fill-opacity="0.95" filter="url(#softglow5)"/>
  <ellipse cx="70" cy="61" rx="5" ry="2.5" fill="#ff3860" fill-opacity="0.95" filter="url(#softglow5)"/>
  <!-- Eye lines (fierce) -->
  <line x1="43" y1="58" x2="50" y2="60" stroke="#ff3860" stroke-width="1" stroke-opacity="0.7"/>
  <line x1="77" y1="58" x2="70" y2="60" stroke="#ff3860" stroke-width="1" stroke-opacity="0.7"/>
  <!-- Eye shine -->
  <ellipse cx="48.5" cy="60" rx="1.5" ry="1" fill="#fff" fill-opacity="0.9"/>
  <ellipse cx="68.5" cy="60" rx="1.5" ry="1" fill="#fff" fill-opacity="0.9"/>

  <!-- Small nose -->
  <ellipse cx="60" cy="68" rx="2" ry="1.5" fill="#ff3860" fill-opacity="0.5"/>

  <!-- Smirk mouth -->
  <path d="M 54 73 Q 63 77 68 72" fill="none" stroke="#ff3860" stroke-width="1.5" stroke-linecap="round"/>
  <!-- Small fang -->
  <line x1="58" y1="73.5" x2="57" y2="76" stroke="#ff3860" stroke-width="1.2" stroke-opacity="0.8"/>

  <!-- Blush (even dangerous chars are cute!) -->
  <ellipse cx="44" cy="70" rx="5" ry="3" fill="#ff3860" fill-opacity="0.15"/>
  <ellipse cx="76" cy="70" rx="5" ry="3" fill="#ff3860" fill-opacity="0.15"/>

  <!-- Forehead gem/mark -->
  <polygon points="60,50 57,54 60,55.5 63,54" fill="#ff3860" fill-opacity="0.7" filter="url(#softglow5)"/>

  <!-- Corner cuts -->
  <polygon points="10,34 20,28 20,40" fill="#ff3860" fill-opacity="0.3"/>
  <polygon points="110,34 100,28 100,40" fill="#ff3860" fill-opacity="0.3"/>

  <!-- Status dot - red/danger -->
  <circle cx="94" cy="88" r="4" fill="#ff3860" filter="url(#softglow5)"/>
  <circle cx="94" cy="88" r="2" fill="#ff80a0"/>
</svg>