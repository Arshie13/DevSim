<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 120 120" width="120" height="120">
  <defs>
    <radialGradient id="bg4" cx="50%" cy="50%" r="50%">
      <stop offset="0%" stop-color="#1e1500"/>
      <stop offset="100%" stop-color="#0a0e1a"/>
    </radialGradient>
    <radialGradient id="face4" cx="50%" cy="40%" r="55%">
      <stop offset="0%" stop-color="#1e1500"/>
      <stop offset="100%" stop-color="#0d0c08"/>
    </radialGradient>
    <filter id="glow4">
      <feGaussianBlur stdDeviation="2.5" result="blur"/>
      <feMerge><feMergeNode in="blur"/><feMergeNode in="SourceGraphic"/></feMerge>
    </filter>
    <filter id="softglow4">
      <feGaussianBlur stdDeviation="1.5" result="blur"/>
      <feMerge><feMergeNode in="blur"/><feMergeNode in="SourceGraphic"/></feMerge>
    </filter>
    <clipPath id="hexclip4">
      <polygon points="60,4 112,32 112,88 60,116 8,88 8,32"/>
    </clipPath>
    <linearGradient id="ring4" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#ffb400"/>
      <stop offset="50%" stop-color="#ffe066"/>
      <stop offset="100%" stop-color="#ffb400" stop-opacity="0.2"/>
    </linearGradient>
  </defs>

  <!-- Outer ring glow -->
  <polygon points="60,2 114,31 114,89 60,118 6,89 6,31" fill="none" stroke="#ffb400" stroke-width="1.5" stroke-opacity="0.4" filter="url(#glow4)"/>
  <polygon points="60,2 114,31 114,89 60,118 6,89 6,31" fill="none" stroke="url(#ring4)" stroke-width="2" stroke-dasharray="50 210" stroke-dashoffset="80"/>

  <!-- Background hex -->
  <polygon points="60,6 110,33 110,87 60,114 10,87 10,33" fill="url(#bg4)" clip-path="url(#hexclip4)"/>

  <!-- Grid lines -->
  <g clip-path="url(#hexclip4)" opacity="0.06">
    <line x1="0" y1="20" x2="120" y2="20" stroke="#ffb400" stroke-width="0.5"/>
    <line x1="0" y1="40" x2="120" y2="40" stroke="#ffb400" stroke-width="0.5"/>
    <line x1="0" y1="60" x2="120" y2="60" stroke="#ffb400" stroke-width="0.5"/>
    <line x1="0" y1="80" x2="120" y2="80" stroke="#ffb400" stroke-width="0.5"/>
    <line x1="0" y1="100" x2="120" y2="100" stroke="#ffb400" stroke-width="0.5"/>
    <line x1="20" y1="0" x2="20" y2="120" stroke="#ffb400" stroke-width="0.5"/>
    <line x1="40" y1="0" x2="40" y2="120" stroke="#ffb400" stroke-width="0.5"/>
    <line x1="60" y1="0" x2="60" y2="120" stroke="#ffb400" stroke-width="0.5"/>
    <line x1="80" y1="0" x2="80" y2="120" stroke="#ffb400" stroke-width="0.5"/>
    <line x1="100" y1="0" x2="100" y2="120" stroke="#ffb400" stroke-width="0.5"/>
  </g>

  <!-- Body -->
  <polygon points="32,114 88,114 96,108 80,96 40,96 24,108" fill="#0d0c08" clip-path="url(#hexclip4)"/>
  <!-- Collar / hoodie style -->
  <polygon points="50,96 70,96 75,104 60,108 45,104" fill="#ffb400" fill-opacity="0.2" clip-path="url(#hexclip4)"/>
  <!-- Hoodie string detail -->
  <line x1="56" y1="97" x2="54" y2="106" stroke="#ffb400" stroke-width="0.8" opacity="0.5"/>
  <line x1="64" y1="97" x2="66" y2="106" stroke="#ffb400" stroke-width="0.8" opacity="0.5"/>
  <circle cx="53" cy="107" r="2" fill="#ffb400" fill-opacity="0.5"/>
  <circle cx="67" cy="107" r="2" fill="#ffb400" fill-opacity="0.5"/>

  <!-- Head -->
  <ellipse cx="60" cy="62" rx="22" ry="24" fill="url(#face4)"/>
  <ellipse cx="60" cy="62" rx="22" ry="24" fill="none" stroke="#ffb400" stroke-width="0.8" stroke-opacity="0.5"/>

  <!-- Fluffy bear ears -->
  <circle cx="40" cy="44" r="8" fill="#1e1500" stroke="#ffb400" stroke-width="0.8" stroke-opacity="0.6"/>
  <circle cx="80" cy="44" r="8" fill="#1e1500" stroke="#ffb400" stroke-width="0.8" stroke-opacity="0.6"/>
  <!-- Inner ear fluff -->
  <circle cx="40" cy="44" r="4.5" fill="#ffb400" fill-opacity="0.25"/>
  <circle cx="80" cy="44" r="4.5" fill="#ffb400" fill-opacity="0.25"/>
  <circle cx="40" cy="44" r="2" fill="#ffb400" fill-opacity="0.5"/>
  <circle cx="80" cy="44" r="2" fill="#ffb400" fill-opacity="0.5"/>

  <!-- Fluffy hair tuft -->
  <ellipse cx="60" cy="42" rx="18" ry="7" fill="#ffb400" fill-opacity="0.85"/>
  <ellipse cx="52" cy="44" rx="6" ry="5" fill="#ffb400" fill-opacity="0.7"/>
  <ellipse cx="68" cy="44" rx="6" ry="5" fill="#ffb400" fill-opacity="0.7"/>

  <!-- Visor band -->
  <rect x="40" y="56" width="40" height="10" rx="3" fill="#ffb400" fill-opacity="0.15" stroke="#ffb400" stroke-width="0.8"/>
  <!-- Eyes - wide and cute -->
  <ellipse cx="50" cy="61" rx="5.5" ry="4" fill="#ffb400" fill-opacity="0.9" filter="url(#softglow4)"/>
  <ellipse cx="70" cy="61" rx="5.5" ry="4" fill="#ffb400" fill-opacity="0.9" filter="url(#softglow4)"/>
  <!-- Big round pupils -->
  <circle cx="50" cy="61" r="3" fill="#1e1500"/>
  <circle cx="70" cy="61" r="3" fill="#1e1500"/>
  <!-- Pupil highlight ring -->
  <circle cx="50" cy="61" r="2" fill="none" stroke="#ffb400" stroke-width="0.5" stroke-opacity="0.8"/>
  <circle cx="70" cy="61" r="2" fill="none" stroke="#ffb400" stroke-width="0.5" stroke-opacity="0.8"/>
  <!-- Eye shine -->
  <circle cx="48.5" cy="59.5" r="1.2" fill="#fff" fill-opacity="0.95"/>
  <circle cx="68.5" cy="59.5" r="1.2" fill="#fff" fill-opacity="0.95"/>
  <!-- Tiny sparkle dot -->
  <circle cx="52" cy="63" r="0.6" fill="#fff" fill-opacity="0.7"/>
  <circle cx="72" cy="63" r="0.6" fill="#fff" fill-opacity="0.7"/>

  <!-- Bear nose -->
  <ellipse cx="60" cy="68" rx="3" ry="2" fill="#ffb400" fill-opacity="0.7"/>
  <ellipse cx="60" cy="68" rx="1.5" ry="1" fill="#ffb400"/>

  <!-- Happy mouth -->
  <path d="M 52 72 Q 60 80 68 72" fill="none" stroke="#ffb400" stroke-width="1.5" stroke-linecap="round"/>
  <!-- Chubby cheeks -->
  <ellipse cx="43" cy="70" rx="6" ry="4" fill="#ffb400" fill-opacity="0.18"/>
  <ellipse cx="77" cy="70" rx="6" ry="4" fill="#ffb400" fill-opacity="0.18"/>

  <!-- Corner cuts -->
  <polygon points="10,34 20,28 20,40" fill="#ffb400" fill-opacity="0.3"/>
  <polygon points="110,34 100,28 100,40" fill="#ffb400" fill-opacity="0.3"/>

  <!-- Status dot - warning yellow -->
  <circle cx="94" cy="88" r="4" fill="#ffb400" filter="url(#softglow4)"/>
  <circle cx="94" cy="88" r="2" fill="#ffe066"/>
</svg>